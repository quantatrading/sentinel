name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python version
        run: python3 --version
      - name: Unit tests
        run: python3 -m unittest discover -v
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh test_linux.sh
      - name: Example configuration
        run: python3 -I sentinel.py --config sentinel.json.example --check-config
      - name: Release integrity
        run: sha256sum --check --strict SHA256SUMS
      - name: Build installation package
        run: python3 release.py --build
